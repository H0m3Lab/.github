name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove private values** (IP addresses, host names, API keys, tokens,
        passwords) from everything you paste below. Security problems go to the **Security** tab instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit you are running
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker Compose
        - Docker (other)
        - Directly (no container)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For example `docker compose logs --tail 100`. Redact private values.
      render: text
