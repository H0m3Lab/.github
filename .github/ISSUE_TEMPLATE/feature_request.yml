name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your situation and what is missing today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you tried or considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
